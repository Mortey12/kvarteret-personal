[project]
name = "kvarteret-personal"
version = "0.1.0"
description = "FastAPI replacement for the Kvarteret personal system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "azure-storage-blob>=12.28.0",
    "email-validator>=2.3.0",
    "fastapi>=0.135.1",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "passlib>=1.7.4",
    "pillow>=13.0.0",
    "phonenumbers>=9.0.26",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0.48",
    "starlette>=1.0.1",
    "posthog>=7.0,<8",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "cryptography>=46.0.7",
    "idna>=3.15",
    "import-linter>=2.11",
    "mako>=1.3.12",
    "pip-audit>=2.10.0",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "requests>=2.33.0",
    "ruff>=0.15.7",
    "ty>=0.0.24",
    "urllib3>=2.8.0",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
