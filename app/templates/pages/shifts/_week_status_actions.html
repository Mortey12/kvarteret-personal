{% set item = page.status %}
<div class="noprint flex flex-wrap items-center gap-2" data-week-status data-group-id="{{ item.group_id }}">
  {% for form_status, form_label, primary in [('open', 'Åpne for ønsker', false), ('published', 'Publiser uka', true)] %}
    <form action="/shifts/weeks/status" method="post">
      <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
      <input type="hidden" name="group_id" value="{{ item.group_id }}">
      <input type="hidden" name="week" value="{{ view.week_start.isoformat() }}">
      <input type="hidden" name="status" value="{{ form_status }}">
      <input type="hidden" name="view_group" value="{{ view.bar_id }}">
      <input type="hidden" name="return_to" value="{{ ("/shifts/week?group=" ~ view.bar_id ~ "&week=" ~ view.week_start.isoformat()) }}" data-return-to>
      <button class="{{ 'app-button' if primary else 'app-button-secondary' }} min-h-11 px-4 text-sm" type="submit" {% if (item.status == form_status and item.explicit) or (form_status == 'open' and not item.can_open) %}disabled{% endif %}>{{ form_label }}</button>
    </form>
  {% endfor %}
  {% if not item.can_open %}<p class="text-xs leading-tight text-stone-700" data-open-hint>Bare kommende uker kan åpnes for ønsker.</p>{% endif %}
</div>
