<div class="grid gap-2 border-2 border-stone-900 bg-white px-3 py-2" data-week-bar>
<div class="flex flex-wrap items-center gap-2" data-week-bar-row="view">
  <a aria-label="Forrige uke, uke {{ view.previous_week.isocalendar().week }}" class="app-button-secondary noprint" href="/shifts/week?week={{ view.previous_week.isoformat() }}&amp;group={{ view.bar_id }}" data-week-prev><span aria-hidden="true">‹</span></a>
  <h2 class="min-w-40 text-center text-base font-semibold" data-week-label>{{ view.week_label }}</h2>
  <a aria-label="Neste uke, uke {{ view.next_week.isocalendar().week }}" class="app-button-secondary noprint" href="/shifts/week?week={{ view.next_week.isoformat() }}&amp;group={{ view.bar_id }}" data-week-next><span aria-hidden="true">›</span></a>
  {% include "pages/shifts/_week_status_badge.html" %}
  {% include "pages/shifts/_week_chips.html" %}
  <div class="noprint ml-auto flex flex-wrap gap-2">
    <button class="app-button-secondary min-h-11 px-4 text-sm" type="button" aria-expanded="true" aria-controls="week-people-panel" data-people-toggle>Skjul folk</button>
    <button class="app-button-secondary min-h-11 px-4 text-sm" type="button" data-print-week>Skriv ut</button>
  </div>
</div>
{% if page.status %}
<div class="noprint flex flex-wrap items-center gap-2" data-week-bar-row="actions">
{% include "pages/shifts/_week_status_actions.html" %}
</div>
{% endif %}
</div>
