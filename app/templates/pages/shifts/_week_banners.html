{% for banner in page.plan.banners %}
  <form action="/shifts/weeks/status" class="noprint flex w-full flex-wrap items-center justify-between gap-4 border-4 px-6 py-5 text-lg font-medium {% if banner.urgent %}border-red-700 bg-red-100 text-red-950{% else %}border-amber-500 bg-amber-100 text-amber-950{% endif %}" data-week-banner data-banner-level="{{ 'strong' if banner.urgent else 'warning' }}" method="post" role="{{ 'alert' if banner.urgent else 'status' }}">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <input type="hidden" name="group_id" value="{{ banner.group_id }}">
    <input type="hidden" name="week" value="{{ banner.week_start.isoformat() }}">
    <input type="hidden" name="status" value="published">
    <input type="hidden" name="view_group" value="{{ view.bar_id }}">
    <input type="hidden" name="return_to" value="{{ ("/shifts/week?group=" ~ view.bar_id ~ "&week=" ~ view.week_start.isoformat()) }}" data-return-to>
    <span>{% if page.bars | length > 1 %}<strong>{{ banner.group_name }}:</strong> {% endif %}{{ banner.text }}</span>
    <button class="app-button" type="submit">Publiser</button>
  </form>
{% endfor %}
